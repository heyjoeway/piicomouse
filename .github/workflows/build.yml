name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [pico_w, pico2_w]
      fail-fast: false

    env:
      PICO_SDK_VERSION: "2.2.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ARM toolchain and build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            build-essential \
            python3

      - name: Cache Pico SDK
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Clone Pico SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone \
            --branch $PICO_SDK_VERSION \
            --recurse-submodules \
            --depth 1 \
            https://github.com/raspberrypi/pico-sdk.git \
            ${{ github.workspace }}/pico-sdk

      - name: Configure for ${{ matrix.board }}
        run: |
          mkdir -p build-${{ matrix.board }}
          cmake \
            -G Ninja \
            -B build-${{ matrix.board }} \
            -S . \
            -DPICO_BOARD=${{ matrix.board }} \
            -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
            -DCMAKE_BUILD_TYPE=Release
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk

      - name: Build for ${{ matrix.board }}
        run: cmake --build build-${{ matrix.board }} --parallel

      - name: Upload UF2 artifact for ${{ matrix.board }}
        uses: actions/upload-artifact@v7
        with:
          name: piicomouse2-${{ matrix.board }}-${{ github.sha }}
          path: |
            build-${{ matrix.board }}/piicomouse2-*.uf2
            build-${{ matrix.board }}/piicomouse2-*.dis
          if-no-files-found: error
          retention-days: 90
